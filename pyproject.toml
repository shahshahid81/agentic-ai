[project]
name = "agentic-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Shahid Shah", email = "shahshahid2123@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.7.19",
    "dotenv>=0.9.9",
    "gradio>=6.27.0",
    "graphviz>=0.21",
    "langchain>=1.4.2",
    "langchain-community>=0.4.2",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-openai>=1.6.5",
    "langgraph-checkpoint>=4.2.0",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "openai>=3.14.0",
    "openai-agents>=0.22.2",
    "pypdf>=6.18.1",
    "python-pptx>=1.0.2",
    "wikipedia>=1.4.0",
]

[project.scripts]
agentic-ai = "agentic_ai:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
